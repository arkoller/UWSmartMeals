<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>recipes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <a href="meal-plans.html" class="logo">UW SmartMeals</a>

      <div class="auth-buttons">
        <a href="meal-plans.html" class="btn login" class="">My Meal Plan</a>
        <a href="recipes.html" class="btn signup">Meals</a>
        <a href="index.html" class="btn signup">Log Out</a>
      </div>
    </div>

    <div id="mealsContainer"></div>

    <div class="content-wrapper">
      <div class="filter-box">
        <h3>Set Your Preferences</h3>

        <label>Diet</label>
        <div class="meal-filter-box">
          <div class="checkbox-container">
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="vegetarian"
                name="diet-filter"
                value="Vegetarian"
              />
              <label for="vegetarian" class="checkbox-text">Vegetarian</label>
            </div>
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="vegan"
                name="diet-filter"
                value="Vegan"
              />
              <label for="vegan" class="checkbox-text">Vegan</label>
            </div>
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="dairy-free"
                name="diet-filter"
                value="Dairy-Free"
              />
              <label for="dairy-free" class="checkbox-text">Dairy-Free</label>
            </div>
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="nut-free"
                name="diet-filter"
                value="Nut-Free"
              />
              <label for="nut-free" class="checkbox-text">Nut-Free</label>
            </div>
          </div>
        </div>

        <label>Meal</label>
        <div class="meal-filter-box">
          <div class="checkbox-container">
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="breakfast"
                name="meal-type-filter"
                value="Breakfast"
              />
              <label for="breakfast" class="checkbox-text">Breakfast</label>
            </div>
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="lunch"
                name="meal-type-filter"
                value="Lunch"
              />
              <label for="lunch" class="checkbox-text">Lunch</label>
            </div>
            <div class="checkbox-item">
              <input
                type="checkbox"
                id="dinner"
                name="meal-type-filter"
                value="Dinner"
              />
              <label for="dinner" class="checkbox-text">Dinner</label>
            </div>
          </div>
        </div>
      </div>
      <div class="search-container">
        <h3>Search for Meals</h3>
        <input
          id="search-input"
          type="text"
          placeholder="Search for Meals..."
          class="search-input"
        />
        <div class="recipes-container"></div>
      </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-storage.js"></script>

    <script src="config.js"></script>
    <script src="recipes.js"></script>
  </body>
</html>
