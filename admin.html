<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Recipes</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div class="header">
      <a href="index.html" class="logo">UW SmartMeals</a>

      <div class="auth-buttons">
        <a href="#" id="adminLogoutBtn" class="btn signup">Log Out</a>
      </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="content-wrapper">
      <!-- LEFT: ADMIN FORM -->
      <div class="filter-box admin-form-box">
        <h2>Add a Recipe</h2>
        <p>Add a new recipe to the meal ideas collection.</p>

        <form id="addRecipeForm" class="admin-form">
          <label for="mealName">Meal Name</label>
          <input type="text" id="mealName" required />

          <label for="description">Description</label>
          <textarea id="description" required></textarea>

          <label for="groceryItems">Grocery Items</label>
          <small
            style="
              color: rgba(255, 255, 255, 0.75);
              margin-top: -6px;
              display: block;
            "
            >Separate grocery items by comma.</small
          >
          <input type="text" id="groceryItems" required />

          <label for="imageUrl">Image URL</label>
          <input type="url" id="imageUrl" required />

          <div class="group-box">
            <label>Meal Type</label>
            <div class="checkbox-group">
              <label
                ><input type="checkbox" name="mealType" value="Breakfast" />
                Breakfast</label
              >
              <label
                ><input type="checkbox" name="mealType" value="Lunch" />
                Lunch</label
              >
              <label
                ><input type="checkbox" name="mealType" value="Dinner" />
                Dinner</label
              >
            </div>
          </div>

          <div class="group-box">
            <label>Diet</label>
            <div class="checkbox-group">
              <label
                ><input type="checkbox" name="diet" value="Vegetarian" />
                Vegetarian</label
              >
              <label
                ><input type="checkbox" name="diet" value="Vegan" />
                Vegan</label
              >
              <label
                ><input type="checkbox" name="diet" value="Dairy-Free" />
                Dairy-Free</label
              >
              <label
                ><input type="checkbox" name="diet" value="Nut-Free" />
                Nut-Free</label
              >
            </div>
          </div>

          <button type="submit" class="submit-btn">Submit</button>
          <p id="adminMessage" class="admin-message"></p>
        </form>
      </div>

      <!-- RIGHT: RECIPES -->
      <div class="recipes-section">
        <h3>Current Recipes</h3>
        <div class="recipes-container" id="adminRecipesContainer"></div>
      </div>
    </div>

    <!-- DELETE MODAL -->
    <div id="deleteModal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>Permanently remove this recipe?</h3>
        <p>This will delete the recipe from UWSmartMeals.</p>

        <div class="modal-actions">
          <button id="confirmDeleteButton" class="modal-delete-button">
            Delete
          </button>
          <button id="cancelDeleteButton" class="modal-cancel-button">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-firestore.js"></script>

    <script src="config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
