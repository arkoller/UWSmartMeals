<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UW SmartMeals — My Meal Plan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <a href="index.html" class="logo">UW SmartMeals</a>
      <div class="nav">
        <a href="meal-plans.html" class="btn login">My Meal Plan</a>
        <a href="recipes.html" class="btn login">Meals</a>
        <a href="index.html" id="logoutBtn" class="btn signup">Log Out</a>
      </div>
    </div>

    <!-- Selected meals queue -->
    <div class="plan-title-bar">
      <div class="plan-section-title">
        My Selected Meals
        <a href="grocerylist.html" class="grocery-list-btn"
          >Go to My Grocery List</a
        >
      </div>
    </div>
    <div class="meal-queue-section">
      <div class="meal-queue" id="mealQueue"></div>
    </div>

    <!-- 7-day plan grid -->
    <div class="plan-title-bar">
      <div class="plan-section-title">This Week's Meal Plan</div>
    </div>
    <div class="plan-grid-section">
      <div class="plan-grid" id="planGrid"></div>
    </div>

    <!-- Meal detail modal -->
    <div class="meal-detail-modal hidden" id="mealDetailModal">
      <div class="modal-content">
        <button class="modal-close-btn" id="modalCloseBtn">×</button>
        <img class="popup-meal-image" id="popupMealImage" src="" alt="" />
        <div class="popup-meal-name" id="popupMealName"></div>
        <div class="popup-meal-detail" id="popupMealDescription"></div>
        <div class="popup-meal-detail" id="popupMealIngredients"></div>
        <div class="popup-meal-detail" id="popupMealType"></div>
        <div class="popup-meal-detail" id="popupMealDiet"></div>
      </div>
    </div>

    <footer class="footer">
      <p>Developed with guidance from a UHS Registered Dietitian.</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.3.1/firebase-firestore.js"></script>

    <script src="config.js"></script>
    <script src="meal-plans.js"></script>
  </body>
</html>
